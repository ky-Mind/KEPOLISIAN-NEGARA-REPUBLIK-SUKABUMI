<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>surat</title>
    <link rel="icon" type="image/x-icon" href="assets/images/krs.ico">

    <link rel="stylesheet" href="assets/css/surat.css">
    <link rel="stylesheet" href="assets/css/navbar.css">
</head>

<body>

    <div id="navbar-placeholder"></div>


    <div class="header">
        <h1>KEPOLISIAN NEGARA REPUBLIK SUKABUMI</h1>
        <p style="font-size: 20px; letter-spacing: 1.5px;"><strong>DAERAH JAWA TENGAH</strong></p>
        <p>RESOR KOTA BESOR SOLO / SEKTOR CISAAT GIGIR SAETIK</p>
        <p style="font-size: 15px;"><i>Jl. Kutai Utara No.1, Kelurahan Sumber, Kecamatan Banjarsari, Kota Surakarta
                (Solo), Jawa Tengah 57138.</i></p>
    </div>


    <button class="accordion">Surat Penagkapan</button>
    <div class="panel">
        <button class="btn info" onclick="window.location.href='halaman-surat/surat-panggilan.html'">Joko Wikosasih
            (alias: Jokowi)
        </button>
    </div>

    <button class="accordion">surat Perampasan Aset</button>
    <div class="panel">
        <button class="btn info" onclick="window.location.href='halaman-surat/surat-perampasan-aset.html'">Joko
            Wikosasih (alias: Jokowi)
        </button>
    </div>

    <button class="accordion">Surat Perintah Penahanan</button>
    <div class="panel">
        <button class="btn info" onclick="window.location.href='halaman-surat/surat-perintah-penahanan.html'">Joko
            Wikosasih (alias: Jokowi)
        </button>
    </div>
</body>

<script>
    var acc = document.getElementsByClassName("accordion");
    var i;

    for (i = 0; i < acc.length; i++) {
        acc[i].addEventListener("click", function () {
            this.classList.toggle("active");
            var panel = this.nextElementSibling;
            if (panel.style.maxHeight) {
                panel.style.maxHeight = null;
            } else {
                panel.style.maxHeight = panel.scrollHeight + "px";
            }
        });
    }


    fetch('navbar.html')
        .then(response => response.text())
        .then(data => {
            // Mengambil isi navbar.html, tapi kita hanya ambil bagian tag <div class="topnav"> nya saja
            const parser = new DOMParser();
            const doc = parser.parseFromString(data, 'text/html');
            const navContent = doc.querySelector('.topnav').outerHTML;
            document.getElementById('navbar-placeholder').innerHTML = navContent;
        });

    function pindahHalaman() {
        window.location.href = 'surat.html';
    }
</script>

</html>
